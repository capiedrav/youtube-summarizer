AWSTemplateFormatVersion: '2010-09-09'
Description: 'Template 3 of 3: Main EC2 Compute with streamlined external UserData script'

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access.
    Type: AWS::EC2::KeyPair::KeyName
    Default: debian-aws.pem

  LatestDebian12AMI:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/debian/release/12/latest/amd64'

  VpcStackName:
    Type: String
    Default: staging-vpc-stack

  SgStackName:
    Type: String
    Default: cloudflare-security-stack

  S3ScriptBucket:
    Type: String
    Description: The S3 bucket name where init-script.sh is hosted (e.g., your-configuration-bucket)
    Default: your-configuration-bucket

Resources:
  # --- IAM Role allowing EC2 to read the script from S3 ---
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [ec2.amazonaws.com]
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: S3ScriptReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject']
                Resource: !Sub "arn:aws:s3:::${S3ScriptBucket}/init-script.sh"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # --- EC2 Instance ---
  DebianInstance:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        config:
          packages:
            apt:
              git: []
              curl: []
              ca-certificates: []
              gnupg: []
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestDebian12AMI
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId: !ImportValue !Sub "${VpcStackName}-PublicSubnetId"
          GroupSet:
            - !ImportValue !Sub "${SgStackName}-CloudflareSecurityGroupId"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 14
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Download the script from S3 and execute it with Stack Name and Region parameters
          aws s3 cp s3://${S3ScriptBucket}/init-script.sh /tmp/init-script.sh
          chmod +x /tmp/init-script.sh
          /tmp/init-script.sh "${AWS::StackName}" "${AWS::Region}"
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M

  # --- Storage ---
  HomeVolume:
    Type: AWS::EC2::Volume
    Properties:
      Size: 14
      VolumeType: gp3
      AvailabilityZone: !GetAtt DebianInstance.AvailabilityZone

  SwapVolume:
    Type: AWS::EC2::Volume
    Properties:
      Size: 2
      VolumeType: gp3
      AvailabilityZone: !GetAtt DebianInstance.AvailabilityZone

  MountHomeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref DebianInstance
      VolumeId: !Ref HomeVolume
      Device: /dev/xvdb

  MountSwapAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref DebianInstance
      VolumeId: !Ref SwapVolume
      Device: /dev/xvdc

Outputs:
  InstancePublicIp:
    Description: Public IP of the Debian Instance
    Value: !GetAtt DebianInstance.PublicIp