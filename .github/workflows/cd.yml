# workflow to deploy code to staging and production

name: CD workflow
on:
  # this workflow runs on push to main branch
  push:
    branches: [main]

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      contents: read
      pull-requests: write

    # Set job outputs to values from filter step
    outputs:
      source: ${{steps.files_checker.outputs.source}}
      nginx_config: ${{steps.files_checker.outputs.nginx_config}}
      dockerfile-web: ${{steps.files_checker.outputs.dockerfile-web}}
      dockerfile-ai: ${{steps.files_checker.outputs.dockerfile-ai}}

    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: run actionlint action
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 #v0.1.12

      - name: check for changes in source code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: files_checker
        with:
          filters: |
            source:
              - 'source/**'
            nginx_config:
              - 'nginx/**'
            dockerfile-web: # Dockerfile for django container
              - 'Dockerfile'
            dockerfile-ai: # Dockerfile for ai tasks (celery, langchain, etc.)
              - 'Dockerfile-ai

  build-and-push-web-image:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.source == 'true' || needs.check-for-changes.outputs.dockerfile-web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necessary to push image to GHCR

    env:
      IMAGE: ${{github.repository}}-web

    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: build docker image and push it to GHCR
        uses: ./.github/actions/build-push-docker-image
        with:
          image-name: ${{env.IMAGE}}
          push-image: 'true'
          registry: ghcr.io
          password: ${{github.token}}

  build-and-push-ai-image:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.dockerfile-ai == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necessary to push image to GHCR

    env:
      IMAGE: ${{github.repository}}-ai

    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: build docker image and push it to GHCR
        uses: ./.github/actions/build-push-docker-image
        with:
          image-name: ${{env.IMAGE}}
          file: Dockerfile-ai
          push-image: 'true'
          registry: ghcr.io
          password: ${{github.token}}

  build-and-push-nginx-image:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.nginx_config == 'true' # runs if changes in nginx config files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necessary to push image to GHCR

    env:
      IMAGE: ${{github.repository}}-nginx

    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: build and push nginx docker image
        uses: ./.github/actions/build-push-docker-image
        with:
          image-name: ${{env.IMAGE}}
          context: './nginx'
          push-image: 'true'
          registry: ghcr.io
          password: ${{github.token}}
