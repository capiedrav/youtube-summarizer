# workflow to run CI tests before accepting pull requests in main branch

name: CI workflow

on:
  # this workflow runs on pull_request to main branch and on workflow_dispatch on any branch
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency: # abort jobs if new code arrives to the same pull request
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      contents: read
      pull-requests: write

    # Set job outputs to values from filter step
    outputs:
      source: ${{steps.files_checker.outputs.source}}
      nginx_config: ${{steps.files_checker.outputs.nginx_config}}
      dockerfile-web: ${{steps.files_checker.outputs.dockerfile-web}}
      dockerfile-ai: ${{steps.files_checker.outputs.dockerfile-ai}}

    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: run actionlint action
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 #v0.1.12

      - name: check for changes in source code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: files_checker
        with:
          filters: |
            source:
              - 'source/**'
            nginx_config:
              - 'nginx/**'
            dockerfile-web: # Dockerfile for django container
              - 'Dockerfile'
            dockerfile-ai: # Dockerfile for ai tasks (celery, langchain, etc.)
              - 'Dockerfile-ai'

  build-and-run-unit-tests: # runs if changes in source code or docker files
    needs: check-for-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: check for changes
        run: |
          if [[ "${{needs.check-for-changes.outputs.source}}" == "true" ||
                "${{needs.check-for-changes.outputs.dockerfile-web}}" == "true" ]]; then
            echo "RUN_UNIT_TESTS=true" >> "$GITHUB_ENV"
          fi
          
          if [[ "${{needs.check-for-changes.outputs.dockerfile-ai}}" == "true" ]]; then
            echo "BUILD_DOCKERFILE_AI=true" >> "$GITHUB_ENV"
          fi
      - name: extract image name from repository name
        run: |
          IMAGE="${GITHUB_REPOSITORY#*/}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"          

      - name: checkout repository
        if: env.RUN_UNIT_TESTS == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: build Dockerfile image (web)
        if: env.RUN_UNIT_TESTS == 'true'
        uses: ./.github/actions/build-push-docker-image
        with:
          image-name: ${{env.IMAGE}}-web
          push-image: 'false'

      - name: create logs folder (necessary to run unit tests)
        if: env.RUN_UNIT_TESTS == 'true'
        run: |
          mkdir -p logs
          chmod -R 777 logs      

      - name: run unit tests
        if: env.RUN_UNIT_TESTS == 'true'
        run: |
          docker run --rm -e DJANGO_SECRET_KEY="${{secrets.DJANGO_SECRET_KEY}}" -v "${PWD}/logs:/app/logs" \
          "${{env.IMAGE}}-web" sh -c "python manage.py test --no-input -b -v 2" > test_results.txt 2>&1

      - name: show test results in job summary
        if: env.RUN_UNIT_TESTS == 'true' && always() # runs even if the last step fails
        uses: ./.github/actions/show-test-results
        with:
          results-file: test_results.txt

      - name: build Dockerfile-ai image
        if: env.BUILD_DOCKERFILE_AI == 'true'
        uses: ./.github/actions/build-push-docker-image
        with:
          image-name: ${{env.IMAGE}}-ai
          file: Dockerfile-ai
          push-image: 'false'

  build-nginx:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.nginx_config == 'true' # runs if changes in nginx config files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Extract image name from repository name
        run: |
          IMAGE="${GITHUB_REPOSITORY#*/}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: build nginx docker image
        uses: ./.github/actions/build-push-docker-image
        with:
          image-name: ${{env.IMAGE}}-nginx
          context: './nginx'
          push-image: 'false'
